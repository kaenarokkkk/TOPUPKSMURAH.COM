<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showcase</title>
    <style>
        .video-warta-container {
            margin: 20px 0;
            text-align: center;
        }
        .video-warta-card {
            display: inline-block;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .video-warta-desc {
            margin: 10px 0;
            font-size: 16px;
            color: #333;
        }
        .video-warta-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-size: 16px;
        }
        .video-warta-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <header>
        <h1>Showcase Header</h1>
        <div class="video-warta-container">
            <div class="video-warta-card">
                <p class="video-warta-desc">Watch our latest video!</p>
                <a href="https://youtu.be/xP43igW2KWo?si=LWxYjbcZlT2TUCfP" class="video-warta-btn">Watch Video</a>
            </div>
        </div>
    </header>
    <div class="cards-container">
        <!-- Existing cards go here -->
    </div>
</body>
</html>
