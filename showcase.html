<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Website</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }
        .video-button {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .video-button button {
            background-color: #3b3b3b;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        .video-button button:hover {
            background-color: #555555;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Your Website</h1>
    </header>
    <main>
        <section>
            <h2>Original Content</h2>
            <p>This section restores the original structure of the content.</p>
        </section>
        <div class="video-button">
            <button onclick="document.getElementById('videoModal').style.display='block'">Watch Video</button>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Your Website Name</p>
    </footer>
    <div id="videoModal" style="display:none;">
        <div>
            <span onclick="document.getElementById('videoModal').style.display='none'" style="cursor:pointer;">&times;</span>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/example" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
